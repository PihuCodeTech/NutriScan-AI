<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ScanMyFood</title>
  <meta name="description" content="Photograph a meal or a product label, see what it does to your gut, skin, liver and kidneys, and cook a healthier swap.">
  <meta name="theme-color" content="#14352d">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2314352d'/%3E%3Crect x='11' y='13' width='42' height='38' rx='6' fill='%239aa89d'/%3E%3Crect x='15' y='17' width='16' height='14' rx='3' fill='%23fff'/%3E%3Crect x='33' y='17' width='16' height='14' rx='3' fill='%23fff'/%3E%3Crect x='15' y='33' width='34' height='14' rx='3' fill='%23fff'/%3E%3Crect x='15' y='39' width='34' height='8' rx='3' fill='%23e8a317'/%3E%3C/svg%3E">
  <!-- Fonts are optional. Without a connection the page falls back to the system font. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Public+Sans:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <div id="login" class="login" hidden></div>

  <div class="shell">
    <aside class="side">
      <div class="brand">ScanMyFood</div>
      <nav id="nav" aria-label="Main">
        <button type="button" data-page="dashboard">Dashboard</button>
        <button type="button" data-page="scan">Scan food</button>
        <button type="button" data-page="history">History</button>
        <button type="button" data-page="cook">Cook instead</button>
        <button type="button" data-page="rewards">Rewards</button>
        <button type="button" data-page="profile">Health profile</button>
      </nav>
      <div class="side-foot">
        <b id="who">Not signed in</b>
        <button type="button" class="link-btn" data-act="signOut">Sign out</button>
        <span id="status" class="status" role="status">Sample data until the server responds</span>
      </div>
    </aside>

    <main id="main" tabindex="-1"></main>
  </div>

  <noscript><p style="padding:24px">ScanMyFood needs JavaScript to run.</p></noscript>

  <script src="config.js?v=4"></script>
  <script src="data.js?v=4"></script>
  <script src="api.js?v=4"></script>
  <script src="auth.js?v=4"></script>
  <script src="app.js?v=4"></script>
</body>
</html>
